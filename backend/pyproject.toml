[project]
name = "gromotion-backend"
version = "0.1.0"
description = "FastAPI backend + offline ingest for the gromo growth showcase"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Only needed to run `python -m ingest wandb`. The server never imports wandb.
ingest = ["wandb>=0.18"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "ingest", "ingest.sources"]
