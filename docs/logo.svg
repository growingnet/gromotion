<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 9 30 14">
  <!--
    The GroMotion mark, same artwork as frontend/public/favicon.svg but cropped
    to the ink. The favicon keeps a square 0 0 32 32 box because browsers
    letterbox a non-square tab icon; here that box would be 60% empty space.
    Shapes span x 3-31 and y 10-22, so this viewBox is those bounds plus 1 unit.
  -->
  <path d="M8 16 H16 M16 16 H23" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <circle cx="6" cy="16" r="3" fill="#94a3b8"/>
  <circle cx="16" cy="16" r="4.5" fill="#94a3b8"/>
  <circle cx="25" cy="16" r="6" fill="#10b981"/>
</svg>
